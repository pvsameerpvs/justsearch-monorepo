services:
  postgres:
    image: postgres:16-alpine
    container_name: justsearch-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: justsearch_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d justsearch_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
